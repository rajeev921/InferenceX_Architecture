<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="835" viewBox="0 0 1160 835" role="img" aria-labelledby="title desc"><title id="title">Live visual-agent serving and action flow</title><desc id="desc">An image observation goes through transport, preprocessing, vision encoding and language-model inference. The generated action runs in a real environment and changes the next observation. Different caches and timing boundaries must be recorded.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#55707a"/></marker></defs><rect width="1160" height="835" fill="#f5f8f5"/><text x="28" y="35" font-family="Arial,sans-serif" font-size="14" fill="#956119" font-weight="700" text-anchor="start">PROPOSED LIVE IMAGE-AGENT FLOW / conceptual stages; engines may overlap or fuse them</text><rect x="28" y="70" width="255" height="114" rx="5" fill="white" stroke="#c5d5d5"/><text x="42" y="97" font-family="Arial,sans-serif" font-size="16" fill="#956119" font-weight="700" text-anchor="start">Observe</text><text x="42" y="121" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">Capture screenshot / rasterize page</text><text x="42" y="142" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">Record bytes, geometry, transform</text><text x="42" y="163" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">Hash immutable asset</text><rect x="329" y="70" width="255" height="114" rx="5" fill="white" stroke="#c5d5d5"/><text x="343" y="97" font-family="Arial,sans-serif" font-size="16" fill="#956119" font-weight="700" text-anchor="start">Construct + transport</text><text x="343" y="121" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">History + image + tool definitions</text><text x="343" y="142" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">Payload serialization / upload</text><text x="343" y="163" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">Scheduler credit → HTTP start</text><rect x="630" y="70" width="255" height="114" rx="5" fill="white" stroke="#c5d5d5"/><text x="644" y="97" font-family="Arial,sans-serif" font-size="16" fill="#956119" font-weight="700" text-anchor="start">Preprocess</text><text x="644" y="121" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">Fetch, decode, resize, crop/patch</text><text x="644" y="142" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">Model-specific processor settings</text><text x="644" y="163" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">Track processor-cache policy</text><path d="M288 124L323 124" stroke="#55707a" fill="none" stroke-width="1.6" marker-end="url(#arr)"/><path d="M589 124L624 124" stroke="#55707a" fill="none" stroke-width="1.6" marker-end="url(#arr)"/><rect x="630" y="250" width="255" height="119" rx="5" fill="white" stroke="#c5d5d5"/><text x="644" y="277" font-family="Arial,sans-serif" font-size="16" fill="#956119" font-weight="700" text-anchor="start">Vision encoder</text><text x="644" y="301" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">Image features / projection</text><text x="644" y="322" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">Measure actual encoder work</text><text x="644" y="343" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">Reuse only with valid identity</text><rect x="329" y="250" width="255" height="119" rx="5" fill="white" stroke="#c5d5d5"/><text x="343" y="277" font-family="Arial,sans-serif" font-size="16" fill="#956119" font-weight="700" text-anchor="start">Language-model prefill</text><text x="343" y="301" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">Visual + text context</text><text x="343" y="322" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">Valid prefix/KV cache lookup</text><text x="343" y="343" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">Scheduling and new context work</text><rect x="28" y="250" width="255" height="119" rx="5" fill="white" stroke="#c5d5d5"/><text x="42" y="277" font-family="Arial,sans-serif" font-size="16" fill="#956119" font-weight="700" text-anchor="start">Decode + response</text><text x="42" y="301" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">First content → final content</text><text x="42" y="322" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">Actual output length + usage</text><text x="42" y="343" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">HTTP completion separately</text><path d="M757 188L757 244" stroke="#55707a" fill="none" stroke-width="1.6" marker-end="url(#arr)"/><path d="M625 307L590 307" stroke="#55707a" fill="none" stroke-width="1.6" marker-end="url(#arr)"/><path d="M324 307L289 307" stroke="#55707a" fill="none" stroke-width="1.6" marker-end="url(#arr)"/><rect x="28" y="435" width="255" height="123" rx="5" fill="white" stroke="#c5d5d5"/><text x="42" y="462" font-family="Arial,sans-serif" font-size="16" fill="#956119" font-weight="700" text-anchor="start">Parse action</text><text x="42" y="486" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">Wait for complete valid arguments</text><text x="42" y="507" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">Record action-ready timestamp</text><text x="42" y="528" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">Map image/viewport coordinates</text><text x="42" y="549" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">Reject malformed actions</text><rect x="329" y="435" width="255" height="123" rx="5" fill="white" stroke="#c5d5d5"/><text x="343" y="462" font-family="Arial,sans-serif" font-size="16" fill="#956119" font-weight="700" text-anchor="start">Execute + settle</text><text x="343" y="486" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">Run tool in task environment</text><text x="343" y="507" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">Record retries, errors, duration</text><text x="343" y="528" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">Observe actual resulting state</text><text x="343" y="549" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">Preserve causal dependencies</text><rect x="630" y="435" width="255" height="123" rx="5" fill="white" stroke="#c5d5d5"/><text x="644" y="462" font-family="Arial,sans-serif" font-size="16" fill="#956119" font-weight="700" text-anchor="start">Score task</text><text x="644" y="486" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">Final-state evaluator</text><text x="644" y="507" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">Success / deadline / partial score</text><text x="644" y="528" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">Steps + total resource cost</text><text x="644" y="549" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">Evidence and evaluator revision</text><path d="M155 373L155 429" stroke="#55707a" fill="none" stroke-width="1.6" marker-end="url(#arr)"/><path d="M288 494L323 494" stroke="#55707a" fill="none" stroke-width="1.6" marker-end="url(#arr)"/><path d="M589 494L624 494" stroke="#55707a" fill="none" stroke-width="1.6" marker-end="url(#arr)"/><path d="M456 563V606H15V126H26" fill="none" stroke="#55707a" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr)"/><text x="938" y="647" font-family="Arial,sans-serif" font-size="15" fill="#17303b" font-weight="700" text-anchor="end">Next observation comes from the changed environment.</text><text x="28" y="702" font-family="Arial,sans-serif" font-size="13" fill="#086d69" font-weight="700" text-anchor="start">MEASUREMENT BOUNDARIES</text><text x="28" y="730" font-family="Arial,sans-serif" font-size="16" fill="#17303b" font-weight="400" text-anchor="start">Serving: HTTP start → first content / final content / HTTP end</text><text x="28" y="757" font-family="Arial,sans-serif" font-size="16" fill="#17303b" font-weight="400" text-anchor="start">Agent action: observation ready → complete valid action → tool completion</text><text x="28" y="784" font-family="Arial,sans-serif" font-size="16" fill="#17303b" font-weight="400" text-anchor="start">Task: admission → terminal outcome; include all retries and failures</text><text x="28" y="812" font-family="Arial,sans-serif" font-size="14" fill="#086d69" font-weight="700" text-anchor="start">Do not label TTFT as pure encoder or prefill time without internal instrumentation.</text></svg>