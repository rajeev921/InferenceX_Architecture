<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="735" viewBox="0 0 1100 735" role="img" aria-labelledby="title desc"><title id="title">UI request flow</title><desc id="desc">A model selection updates state, checks the query cache, fetches existing rows from the API and database if necessary, then transforms rows and redraws D3. No benchmark is dispatched.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#57707a"/></marker></defs><rect width="1100" height="735" rx="12" fill="#f7f9f7"/><text x="28" y="36" font-family="Arial, sans-serif" font-size="15" fill="#096d69" font-weight="700" text-anchor="start">UI SEQUENCE / CHANGE MODEL</text><text x="85" y="79" font-family="Arial, sans-serif" font-size="15" fill="#172d37" font-weight="700" text-anchor="middle">User / controls</text><path d="M85 99V548" stroke="#c4d2d5" stroke-dasharray="5 6"/><text x="350" y="79" font-family="Arial, sans-serif" font-size="15" fill="#172d37" font-weight="700" text-anchor="middle">React + Query</text><path d="M350 99V548" stroke="#c4d2d5" stroke-dasharray="5 6"/><text x="625" y="79" font-family="Arial, sans-serif" font-size="15" fill="#172d37" font-weight="700" text-anchor="middle">Next.js API</text><path d="M625 99V548" stroke="#c4d2d5" stroke-dasharray="5 6"/><text x="945" y="79" font-family="Arial, sans-serif" font-size="15" fill="#172d37" font-weight="700" text-anchor="middle">Cache / PostgreSQL</text><path d="M945 99V548" stroke="#c4d2d5" stroke-dasharray="5 6"/><path d="M85 137L350 137" fill="none" stroke="#57707a" stroke-width="1.5" marker-end="url(#arrow)"/><text x="217.5" y="125" font-family="Arial, sans-serif" font-size="13" fill="#172d37" font-weight="400" text-anchor="middle">1  Select Qwen3.5</text><rect x="243" y="159" width="228" height="72" rx="7" fill="white" stroke="#c4d2d5"/><rect x="243" y="171" width="3" height="48" fill="#096d69"/><text x="258" y="187" font-family="Arial, sans-serif" font-size="16" fill="#096d69" font-weight="700" text-anchor="start">2  Resolve selection</text><text x="258" y="213" font-family="Arial, sans-serif" font-size="13" fill="#57707a" font-weight="400" text-anchor="start">Availability + query key</text><path d="M350 278L625 278" fill="none" stroke="#57707a" stroke-width="1.5" marker-end="url(#arrow)"/><text x="487.5" y="266" font-family="Arial, sans-serif" font-size="13" fill="#172d37" font-weight="400" text-anchor="middle">3  GET benchmarks?model=…</text><path d="M625 339L945 339" fill="none" stroke="#57707a" stroke-width="1.5" marker-end="url(#arrow)"/><text x="785.0" y="327" font-family="Arial, sans-serif" font-size="13" fill="#172d37" font-weight="400" text-anchor="middle">4  Cached read; SQL if required</text><path d="M945 400L625 400" fill="none" stroke="#57707a" stroke-width="1.5" marker-end="url(#arrow)"/><text x="785.0" y="388" font-family="Arial, sans-serif" font-size="13" fill="#172d37" font-weight="400" text-anchor="middle">5  Saved benchmark rows</text><path d="M625 457L350 457" fill="none" stroke="#57707a" stroke-width="1.5" marker-end="url(#arrow)"/><text x="487.5" y="445" font-family="Arial, sans-serif" font-size="13" fill="#172d37" font-weight="400" text-anchor="middle">6  JSON response</text><rect x="242" y="477" width="228" height="72" rx="7" fill="white" stroke="#c4d2d5"/><rect x="242" y="489" width="3" height="48" fill="#096d69"/><text x="257" y="505" font-family="Arial, sans-serif" font-size="16" fill="#096d69" font-weight="700" text-anchor="start">7  Prepare chart</text><text x="257" y="531" font-family="Arial, sans-serif" font-size="13" fill="#57707a" font-weight="400" text-anchor="start">Filter → derive → frontier</text><path d="M350 581L85 581" fill="none" stroke="#57707a" stroke-width="1.5" marker-end="url(#arrow)"/><text x="217.5" y="569" font-family="Arial, sans-serif" font-size="13" fill="#172d37" font-weight="400" text-anchor="middle">8  D3 redraw</text><text x="505" y="514" font-family="Arial, sans-serif" font-size="14" fill="#096d69" font-weight="700" text-anchor="start">Cache hit in the browser?</text><text x="505" y="538" font-family="Arial, sans-serif" font-size="14" fill="#57707a" font-weight="400" text-anchor="start">Skip the benchmark API fetch and reuse rows.</text><path d="M28 615H1072" stroke="#c4d2d5"/><text x="28" y="645" font-family="Arial, sans-serif" font-size="13" fill="#57707a" font-weight="700" text-anchor="start">Observed request</text><text x="28" y="670" font-family="Arial, sans-serif" font-size="17" fill="#096d69" font-weight="700" text-anchor="start">GET /api/v1/benchmarks?model=Qwen-3.5-397B-A17B</text><text x="28" y="700" font-family="Arial, sans-serif" font-size="14" fill="#57707a" font-weight="400" text-anchor="start">Workflow metadata is another read. No workflow dispatch or new GPU measurement occurs in this sequence.</text></svg>