<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="820" viewBox="0 0 1160 820" role="img" aria-labelledby="title desc"><title id="title">AgentX execution and VLM adaptation</title><desc id="desc">The existing benchmark separates orchestration, traffic generation, model serving and result publication. A proposed VLM extension adds real assets, live environments and task scoring.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#55707a"/></marker></defs><rect width="1160" height="820" fill="#f5f8f5"/><text x="28" y="34" font-family="Arial,sans-serif" font-size="14" fill="#086d69" font-weight="700" text-anchor="start">VERIFIED EXISTING SYSTEM</text><rect x="28" y="62" width="250" height="126" rx="5" fill="white" stroke="#c5d5d5"/><text x="42" y="89" font-family="Arial,sans-serif" font-size="16" fill="#086d69" font-weight="700" text-anchor="start">InferenceX operator</text><text x="42" y="113" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">YAML → validated matrix</text><text x="42" y="134" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">Actions → self-hosted runner</text><text x="42" y="155" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">Serving image + topology</text><text x="42" y="176" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">Exact command + run identity</text><rect x="326" y="62" width="330" height="126" rx="5" fill="white" stroke="#c5d5d5"/><text x="340" y="89" font-family="Arial,sans-serif" font-size="16" fill="#086d69" font-weight="700" text-anchor="start">AgentX Harness / AIPerf</text><text x="340" y="113" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">Weka counts + hashes → text</text><text x="340" y="134" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">t* → warmup → tree replay</text><text x="340" y="155" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">Streaming HTTP + timestamps</text><text x="340" y="176" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">Metrics + phase-tagged records</text><rect x="720" y="62" width="410" height="126" rx="5" fill="white" stroke="#c5d5d5"/><text x="734" y="89" font-family="Arial,sans-serif" font-size="16" fill="#086d69" font-weight="700" text-anchor="start">System under test</text><text x="734" y="113" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">Router / serving engine / accelerator fleet</text><text x="734" y="134" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">Prefix/KV cache + optional CPU offload</text><text x="734" y="155" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">Prefill + decode; optional speculation</text><text x="734" y="176" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">Client output is measured, not task-scored</text><path d="M282 122L320 122" stroke="#55707a" fill="none" stroke-width="1.6" marker-end="url(#arr)"/><path d="M661 122L714 122" stroke="#55707a" fill="none" stroke-width="1.6" marker-end="url(#arr)"/><rect x="326" y="250" width="330" height="117" rx="5" fill="white" stroke="#c5d5d5"/><text x="340" y="277" font-family="Arial,sans-serif" font-size="16" fill="#086d69" font-weight="700" text-anchor="start">Raw evidence + reducers</text><text x="340" y="301" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">Profile JSONL + harness aggregate</text><text x="340" y="322" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">Server metrics + power + logs</text><text x="340" y="343" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">Success/error/warmup accounting</text><rect x="720" y="250" width="410" height="117" rx="5" fill="white" stroke="#c5d5d5"/><text x="734" y="277" font-family="Arial,sans-serif" font-size="16" fill="#086d69" font-weight="700" text-anchor="start">InferenceX-app</text><text x="734" y="301" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">Ingest → database + versioned projections</text><text x="734" y="322" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">APIs → comparison / distributions / timeline</text><text x="734" y="343" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">Point links back to run and artifacts</text><path d="M491 193L491 244" stroke="#55707a" fill="none" stroke-width="1.6" marker-end="url(#arr)"/><path d="M661 308L714 308" stroke="#55707a" fill="none" stroke-width="1.6" marker-end="url(#arr)"/><path d="M925 192V225H660V287" stroke="#55707a" fill="none" stroke-width="1.6" marker-end="url(#arr)"/><text x="28" y="405" font-family="Arial,sans-serif" font-size="14" fill="#956119" font-weight="700" text-anchor="start">PROPOSED VLM TOOLBOX — additional components; not an existing AgentX feature</text><rect x="28" y="431" width="270" height="148" rx="5" fill="white" stroke="#c5d5d5"/><text x="42" y="458" font-family="Arial,sans-serif" font-size="16" fill="#956119" font-weight="700" text-anchor="start">Immutable workload</text><text x="42" y="482" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">Real screenshots / document pages</text><text x="42" y="503" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">Messages + tool schemas + results</text><text x="42" y="524" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">Geometry + transforms + hashes</text><text x="42" y="545" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">Task ground truth held by evaluator</text><text x="42" y="566" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">Dataset and environment versions</text><rect x="348" y="431" width="330" height="148" rx="5" fill="white" stroke="#c5d5d5"/><text x="362" y="458" font-family="Arial,sans-serif" font-size="16" fill="#956119" font-weight="700" text-anchor="start">Choose the experiment</text><text x="362" y="482" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">A  Image-serving load test</text><text x="362" y="503" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">B  Recorded visual-agent replay</text><text x="362" y="524" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">C  Live model → action → observation</text><text x="362" y="545" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">A/B: fixed workload where declared</text><text x="362" y="566" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">C: actual outputs change trajectory</text><rect x="730" y="431" width="400" height="148" rx="5" fill="white" stroke="#c5d5d5"/><text x="744" y="458" font-family="Arial,sans-serif" font-size="16" fill="#956119" font-weight="700" text-anchor="start">VLM deployment</text><text x="744" y="482" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">Preprocess → image encoder → LM</text><text x="744" y="503" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">Separate image/processor/KV cache states</text><text x="744" y="524" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">Natural decoding for quality evaluation</text><text x="744" y="545" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">Optional internal spans; unknown ≠ zero</text><text x="744" y="566" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">Measure transport and action-ready time</text><path d="M303 505L342 505" stroke="#55707a" fill="none" stroke-width="1.6" marker-end="url(#arr)"/><path d="M683 505L724 505" stroke="#55707a" fill="none" stroke-width="1.6" marker-end="url(#arr)"/><rect x="348" y="646" width="330" height="113" rx="5" fill="white" stroke="#c5d5d5"/><text x="362" y="673" font-family="Arial,sans-serif" font-size="16" fill="#956119" font-weight="700" text-anchor="start">Task evaluator + metric reducers</text><text x="362" y="697" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">Success, deadline, latency, cost</text><text x="362" y="718" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">Request/image/tool diagnostics</text><text x="362" y="739" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">Population + version + exclusions</text><rect x="730" y="646" width="400" height="113" rx="5" fill="white" stroke="#c5d5d5"/><text x="744" y="673" font-family="Arial,sans-serif" font-size="16" fill="#956119" font-weight="700" text-anchor="start">Reusable result representation</text><text x="744" y="697" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">Comparison point → run → task → request</text><text x="744" y="718" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">Image + action overlay + before/after state</text><text x="744" y="739" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">Telemetry + evaluator evidence + artifacts</text><path d="M513 583L513 640" stroke="#55707a" fill="none" stroke-width="1.6" marker-end="url(#arr)"/><path d="M683 704L724 704" stroke="#55707a" fill="none" stroke-width="1.6" marker-end="url(#arr)"/><text x="28" y="797" font-family="Arial,sans-serif" font-size="15" fill="#17303b" font-weight="700" text-anchor="start">Existing public UI reads results. Your proposed Run experiment action would submit an explicit job.</text></svg>