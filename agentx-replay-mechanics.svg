<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="735" viewBox="0 0 1160 735" role="img" aria-labelledby="title desc"><title id="title">AgentX replay state machine</title><desc id="desc">Recorded hashes become synthetic text. Initial trees sample a trace position and warm caches, then replay with dependencies. Concurrency counts trees, and lanes recycle only when descendants drain.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#55707a"/></marker></defs><rect width="1160" height="735" fill="#f5f8f5"/><text x="28" y="35" font-family="Arial,sans-serif" font-size="14" fill="#086d69" font-weight="700" text-anchor="start">ONE REPLAY LANE / VERIFIED MECHANISM</text><rect x="28" y="70" width="250" height="115" rx="5" fill="white" stroke="#c5d5d5"/><text x="42" y="97" font-family="Arial,sans-serif" font-size="16" fill="#086d69" font-weight="700" text-anchor="start">1  Reconstruct</text><text x="42" y="121" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">Corpus → deterministic token blocks</text><text x="42" y="142" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">Retain shared-prefix relationships</text><text x="42" y="163" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">Create root + child conversations</text><rect x="326" y="70" width="250" height="115" rx="5" fill="white" stroke="#c5d5d5"/><text x="340" y="97" font-family="Arial,sans-serif" font-size="16" fill="#086d69" font-weight="700" text-anchor="start">2  Sample t*</text><text x="340" y="121" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">Choose initial trace position</text><text x="340" y="142" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">Find warmup/history per stream</text><text x="340" y="163" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">InferenceX range: 25%–75%</text><rect x="624" y="70" width="250" height="115" rx="5" fill="white" stroke="#c5d5d5"/><text x="638" y="97" font-family="Arial,sans-serif" font-size="16" fill="#086d69" font-weight="700" text-anchor="start">3  Warm cache</text><text x="638" y="121" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">Deep-prefix one-token primers</text><text x="638" y="142" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">Extra advances per lane: default 10</text><text x="638" y="163" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">Preserve marker into profiling</text><path d="M282 126L320 126" stroke="#55707a" fill="none" stroke-width="1.6" marker-end="url(#arr)"/><path d="M580 126L618 126" stroke="#55707a" fill="none" stroke-width="1.6" marker-end="url(#arr)"/><text x="28" y="235" font-family="Arial,sans-serif" font-size="17" fill="#086d69" font-weight="700" text-anchor="start">PROFILE / N means N tree lanes, not N in-flight HTTP calls</text><rect x="28" y="266" width="218" height="102" rx="5" fill="white" stroke="#c5d5d5"/><text x="42" y="293" font-family="Arial,sans-serif" font-size="16" fill="#086d69" font-weight="700" text-anchor="start">Root turn</text><text x="42" y="317" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">Send full chat history</text><text x="42" y="338" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">Time the live response</text><rect x="317" y="255" width="223" height="100" rx="5" fill="white" stroke="#c5d5d5"/><text x="331" y="282" font-family="Arial,sans-serif" font-size="16" fill="#086d69" font-weight="700" text-anchor="start">Child A</text><text x="331" y="306" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">Own request sequence</text><text x="331" y="327" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">Recorded delay + live latency</text><rect x="317" y="395" width="223" height="100" rx="5" fill="white" stroke="#c5d5d5"/><text x="331" y="422" font-family="Arial,sans-serif" font-size="16" fill="#086d69" font-weight="700" text-anchor="start">Child B</text><text x="331" y="446" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">Can overlap with child A</text><text x="331" y="467" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">Independent completion</text><rect x="613" y="325" width="236" height="107" rx="5" fill="white" stroke="#c5d5d5"/><text x="627" y="352" font-family="Arial,sans-serif" font-size="16" fill="#086d69" font-weight="700" text-anchor="start">Join → parent resumes</text><text x="627" y="376" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">Wait for required children</text><text x="627" y="397" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">Keep end-to-start pacing</text><text x="627" y="418" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">Default history is reconstructed</text><rect x="915" y="325" width="215" height="107" rx="5" fill="white" stroke="#c5d5d5"/><text x="929" y="352" font-family="Arial,sans-serif" font-size="16" fill="#086d69" font-weight="700" text-anchor="start">Tree drained?</text><text x="929" y="376" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">Root + all descendants</text><text x="929" y="397" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">Then recycle from turn 0</text><path d="M251 311L311 305" stroke="#55707a" fill="none" stroke-width="1.6" marker-end="url(#arr)"/><path d="M250 339L311 444" stroke="#55707a" fill="none" stroke-width="1.6" marker-end="url(#arr)"/><path d="M544 305L607 349" stroke="#55707a" fill="none" stroke-width="1.6" marker-end="url(#arr)"/><path d="M544 444L607 406" stroke="#55707a" fill="none" stroke-width="1.6" marker-end="url(#arr)"/><path d="M853 378L909 378" stroke="#55707a" fill="none" stroke-width="1.6" marker-end="url(#arr)"/><path d="M1020 436V545H137V373" stroke="#55707a" fill="none" stroke-width="1.6" marker-end="url(#arr)"/><text x="540" y="537" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="middle">Fresh session identity on recycle</text><text x="28" y="600" font-family="Arial,sans-serif" font-size="13" fill="#956119" font-weight="700" text-anchor="start">CLOCK EXAMPLE</text><text x="28" y="628" font-family="Arial,sans-serif" font-size="16" fill="#17303b" font-weight="400" text-anchor="start">Recorded: start 10s, duration 3s, next start 18s → idle gap 5s.</text><text x="28" y="655" font-family="Arial,sans-serif" font-size="16" fill="#17303b" font-weight="400" text-anchor="start">New server duration 7s → successor waits 7s + 5s from this request’s start.</text><text x="28" y="698" font-family="Arial,sans-serif" font-size="15" fill="#086d69" font-weight="700" text-anchor="start">Outputs affect elapsed replay timing. By default they do not choose the next action or screenshot.</text></svg>