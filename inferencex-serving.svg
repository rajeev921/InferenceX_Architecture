<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="570" viewBox="0 0 1100 570" role="img" aria-labelledby="title desc"><title id="title">Serving inside a benchmark job</title><desc id="desc">A workload client drives either an aggregated serving deployment or a router with separate prefill and decode pools. Telemetry is stored as artifacts.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#57707a"/></marker></defs><rect width="1100" height="570" rx="12" fill="#f7f9f7"/><text x="28" y="35" font-family="Arial, sans-serif" font-size="15" fill="#57707a" font-weight="700" text-anchor="start">INSIDE ONE BENCHMARK DEPLOYMENT</text><text x="28" y="75" font-family="Arial, sans-serif" font-size="15" fill="#a86717" font-weight="700" text-anchor="start">AGGREGATED</text><rect x="28" y="95" width="240" height="102" rx="7" fill="white" stroke="#c4d2d5"/><rect x="28" y="107" width="3" height="78" fill="#a86717"/><text x="43" y="123" font-family="Arial, sans-serif" font-size="16" fill="#a86717" font-weight="700" text-anchor="start">Workload client</text><text x="43" y="149" font-family="Arial, sans-serif" font-size="13" fill="#57707a" font-weight="400" text-anchor="start">Fixed-length requests OR</text><text x="43" y="170" font-family="Arial, sans-serif" font-size="13" fill="#57707a" font-weight="400" text-anchor="start">AgentX session-tree replay</text><rect x="424" y="95" width="290" height="102" rx="7" fill="white" stroke="#c4d2d5"/><rect x="424" y="107" width="3" height="78" fill="#a86717"/><text x="439" y="123" font-family="Arial, sans-serif" font-size="16" fill="#a86717" font-weight="700" text-anchor="start">Serving deployment</text><text x="439" y="149" font-family="Arial, sans-serif" font-size="13" fill="#57707a" font-weight="400" text-anchor="start">Prefill + decode in one pool</text><text x="439" y="170" font-family="Arial, sans-serif" font-size="13" fill="#57707a" font-weight="400" text-anchor="start">SGLang / vLLM / TRT-LLM</text><rect x="830" y="95" width="242" height="102" rx="7" fill="white" stroke="#c4d2d5"/><rect x="830" y="107" width="3" height="78" fill="#a86717"/><text x="845" y="123" font-family="Arial, sans-serif" font-size="16" fill="#a86717" font-weight="700" text-anchor="start">Accelerator allocation</text><text x="845" y="149" font-family="Arial, sans-serif" font-size="13" fill="#57707a" font-weight="400" text-anchor="start">TP / EP / PP as configured</text><text x="845" y="170" font-family="Arial, sans-serif" font-size="13" fill="#57707a" font-weight="400" text-anchor="start">Weights + KV-cache memory</text><path d="M272 146L418 146" fill="none" stroke="#57707a" stroke-width="1.5" marker-end="url(#arrow)"/><text x="345.0" y="137.0" font-family="Arial, sans-serif" font-size="12" fill="#57707a" font-weight="400" text-anchor="middle">streaming HTTP</text><path d="M718 146L824 146" fill="none" stroke="#57707a" stroke-width="1.5" marker-end="url(#arrow)"/><text x="28" y="250" font-family="Arial, sans-serif" font-size="15" fill="#096d69" font-weight="700" text-anchor="start">DISAGGREGATED</text><rect x="28" y="292" width="218" height="102" rx="7" fill="white" stroke="#c4d2d5"/><rect x="28" y="304" width="3" height="78" fill="#096d69"/><text x="43" y="320" font-family="Arial, sans-serif" font-size="16" fill="#096d69" font-weight="700" text-anchor="start">Workload client</text><text x="43" y="346" font-family="Arial, sans-serif" font-size="13" fill="#57707a" font-weight="400" text-anchor="start">Requests and timestamps</text><text x="43" y="367" font-family="Arial, sans-serif" font-size="13" fill="#57707a" font-weight="400" text-anchor="start">Conversation-aware routing</text><rect x="298" y="292" width="205" height="102" rx="7" fill="white" stroke="#c4d2d5"/><rect x="298" y="304" width="3" height="78" fill="#096d69"/><text x="313" y="320" font-family="Arial, sans-serif" font-size="16" fill="#096d69" font-weight="700" text-anchor="start">Router / front end</text><text x="313" y="346" font-family="Arial, sans-serif" font-size="13" fill="#57707a" font-weight="400" text-anchor="start">Placement and affinity</text><text x="313" y="367" font-family="Arial, sans-serif" font-size="13" fill="#57707a" font-weight="400" text-anchor="start">Recipe-specific stack</text><rect x="580" y="269" width="205" height="102" rx="7" fill="white" stroke="#c4d2d5"/><rect x="580" y="281" width="3" height="78" fill="#096d69"/><text x="595" y="297" font-family="Arial, sans-serif" font-size="16" fill="#096d69" font-weight="700" text-anchor="start">Prefill workers</text><text x="595" y="323" font-family="Arial, sans-serif" font-size="13" fill="#57707a" font-weight="400" text-anchor="start">Process prompt tokens</text><text x="595" y="344" font-family="Arial, sans-serif" font-size="13" fill="#57707a" font-weight="400" text-anchor="start">Build / reuse KV state</text><rect x="864" y="269" width="208" height="102" rx="7" fill="white" stroke="#c4d2d5"/><rect x="864" y="281" width="3" height="78" fill="#096d69"/><text x="879" y="297" font-family="Arial, sans-serif" font-size="16" fill="#096d69" font-weight="700" text-anchor="start">Decode workers</text><text x="879" y="323" font-family="Arial, sans-serif" font-size="13" fill="#57707a" font-weight="400" text-anchor="start">Generate output tokens</text><text x="879" y="344" font-family="Arial, sans-serif" font-size="13" fill="#57707a" font-weight="400" text-anchor="start">Separate GPU pool</text><path d="M250 342L291 342" fill="none" stroke="#57707a" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M507 322L574 322" fill="none" stroke="#57707a" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M790 322L858 322" fill="none" stroke="#57707a" stroke-width="1.5" marker-end="url(#arrow)"/><text x="824.0" y="313.0" font-family="Arial, sans-serif" font-size="12" fill="#57707a" font-weight="400" text-anchor="middle">KV transfer</text><path d="M968 375V431H399V399" fill="none" stroke="#57707a" stroke-width="1.5" marker-end="url(#arrow)"/><text x="700" y="422" font-family="Arial, sans-serif" font-size="13" fill="#57707a" font-weight="400" text-anchor="middle">streamed output via front end</text><text x="28" y="490" font-family="Arial, sans-serif" font-size="16" fill="#172d37" font-weight="700" text-anchor="start">Telemetry and evidence</text><text x="28" y="515" font-family="Arial, sans-serif" font-size="14" fill="#57707a" font-weight="400" text-anchor="start">Client latency / throughput + server cache / queue metrics + optional GPU power + evaluation outputs</text><text x="28" y="541" font-family="Arial, sans-serif" font-size="14" fill="#57707a" font-weight="400" text-anchor="start">Deployments vary by recipe. Multi-node does not automatically mean disaggregated.</text></svg>