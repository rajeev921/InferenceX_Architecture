<svg xmlns="http://www.w3.org/2000/svg" font-family="Inter, Helvetica, Arial, sans-serif" viewBox="0 0 760 724" role="img" aria-label="An AgentX point: server up, AIPerf replays traces, reducer scores it" font-size="11.5"><defs><marker id="ax-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a8a8a"></path></marker></defs><rect x="0" y="0" width="760" height="724" fill="#ffffff"></rect><text x="24" y="34" font-size="15" font-weight="600" fill="#1a1a1a">An AgentX point: server up, AIPerf replays traces, reducer scores it</text><text x="24" y="54" fill="#5a5a5a">InferenceX @ 88349ad · highlighted band = what to bring into our stack</text><g><rect x="24" y="76" width="712" height="136" rx="8" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="5 4"></rect><text x="40" y="98" font-size="13" font-weight="600" fill="#5a5a5a">Fleet orchestration — our stack replaces this</text></g><g><rect x="24" y="260" width="712" height="256" rx="8" fill="#2f6fdb" fill-opacity="0.06" stroke="#2f6fdb" stroke-width="2"></rect><text x="720" y="282" text-anchor="end" font-size="13" font-weight="600" fill="#1a1a1a">AgentX client — extract this</text></g><g><rect x="24" y="564" width="712" height="136" rx="8" fill="none" stroke="#8a8a8a" stroke-width="1.25"></rect><text x="720" y="586" text-anchor="end" font-size="13" font-weight="600" fill="#1a1a1a">Post-processing — extract to match published numbers</text></g><g fill="none" stroke="#8a8a8a" stroke-width="1.25"><path d="M248 152H276" marker-end="url(#ax-arrow)"></path><path d="M484 152H512" marker-end="url(#ax-arrow)"></path><path d="M616 196V240H144V292" marker-end="url(#ax-arrow)"></path><path d="M248 336H276" marker-end="url(#ax-arrow)"></path><path d="M484 336H512" marker-end="url(#ax-arrow)"></path><path d="M616 380V396H144V412" marker-end="url(#ax-arrow)"></path><path d="M248 456H276" marker-end="url(#ax-arrow)"></path><path d="M484 456H512" marker-end="url(#ax-arrow)"></path><path d="M616 500V544H144V596" marker-end="url(#ax-arrow)"></path><path d="M248 640H276" marker-end="url(#ax-arrow)"></path><path d="M484 640H512" marker-end="url(#ax-arrow)"></path></g><text x="380" y="232" text-anchor="middle" fill="#5a5a5a">server healthy → runs benchmark.command</text><text x="380" y="536" text-anchor="middle" fill="#5a5a5a">profile_export.jsonl + _aiperf.json + server_metrics_export.json</text><g><rect x="40" y="108" width="208" height="88" rx="8" fill="none" stroke="#8a8a8a" stroke-width="1.25"></rect><text x="52" y="132" font-size="13" font-weight="600" fill="#1a1a1a">Master YAML + matrix</text><text x="52" y="148" fill="#5a5a5a">configs/amd-master.yaml</text><text x="52" y="164" fill="#5a5a5a">infx/matrix: one job per</text><text x="52" y="180" fill="#5a5a5a">TP × conc, duration 3600 s</text></g><g><rect x="276" y="108" width="208" height="88" rx="8" fill="none" stroke="#8a8a8a" stroke-width="1.25"></rect><text x="288" y="132" font-size="13" font-weight="600" fill="#1a1a1a">GitHub Actions</text><text x="288" y="148" fill="#5a5a5a">run-sweep.yml →</text><text x="288" y="164" fill="#5a5a5a">benchmark-tmpl.yml on</text><text x="288" y="180" fill="#5a5a5a">self-hosted GPU runners</text></g><g><rect x="512" y="108" width="208" height="88" rx="8" fill="none" stroke="#8a8a8a" stroke-width="1.25"></rect><text x="524" y="132" font-size="13" font-weight="600" fill="#1a1a1a">Launcher + srt-slurm</text><text x="524" y="148" fill="#5a5a5a">launch_mi355x-amds.sh</text><text x="524" y="164" fill="#5a5a5a">starts the server from the</text><text x="524" y="180" fill="#5a5a5a">recipe agentic.yaml</text></g><g><rect x="40" y="292" width="208" height="88" rx="8" fill="none" stroke="#8a8a8a" stroke-width="1.25"></rect><text x="52" y="316" font-size="13" font-weight="600" fill="#1a1a1a">srt_agentic.sh</text><text x="52" y="332" fill="#5a5a5a">sets server URL, loops</text><text x="52" y="348" fill="#5a5a5a">over CONC_LIST, waits for</text><text x="52" y="364" fill="#5a5a5a">server drain between points</text></g><g><rect x="276" y="292" width="208" height="88" rx="8" fill="none" stroke="#8a8a8a" stroke-width="1.25"></rect><text x="288" y="316" font-size="13" font-weight="600" fill="#1a1a1a">resolve_trace_source</text><text x="288" y="332" fill="#5a5a5a">benchmark_lib.sh L3165</text><text x="288" y="348" fill="#5a5a5a">picks Weka corpus alias,</text><text x="288" y="364" fill="#5a5a5a">pre-downloads HF dataset</text></g><g><rect x="512" y="292" width="208" height="88" rx="8" fill="none" stroke="#8a8a8a" stroke-width="1.25"></rect><text x="524" y="316" font-size="13" font-weight="600" fill="#1a1a1a">install_agentic_deps</text><text x="524" y="332" fill="#5a5a5a">benchmark_lib.sh L3116</text><text x="524" y="348" fill="#5a5a5a">uv venv (Python 3.11) +</text><text x="524" y="364" fill="#5a5a5a">pip install -e utils/aiperf</text></g><g><rect x="40" y="412" width="208" height="88" rx="8" fill="none" stroke="#8a8a8a" stroke-width="1.25"></rect><text x="52" y="436" font-size="13" font-weight="600" fill="#1a1a1a">build_replay_cmd</text><text x="52" y="452" fill="#5a5a5a">benchmark_lib.sh L3236</text><text x="52" y="468" fill="#5a5a5a">aiperf profile --scenario</text><text x="52" y="484" fill="#5a5a5a">inferencex-agentx-mvp …</text></g><g><rect x="276" y="412" width="208" height="88" rx="8" fill="none" stroke="#8a8a8a" stroke-width="1.25"></rect><text x="288" y="436" font-size="13" font-weight="600" fill="#1a1a1a">Run and collect</text><text x="288" y="452" fill="#5a5a5a">run_agentic_replay_and_</text><text x="288" y="468" fill="#5a5a5a">write_outputs, L3412</text><text x="288" y="484" fill="#5a5a5a">log, command, GPU power</text></g><g><rect x="512" y="412" width="208" height="88" rx="8" fill="none" stroke="#8a8a8a" stroke-width="1.25"></rect><text x="524" y="436" font-size="13" font-weight="600" fill="#1a1a1a">AIPerf engine</text><text x="524" y="452" fill="#5a5a5a">utils/aiperf @ 754356e</text><text x="524" y="468" fill="#5a5a5a">Weka loader, warmup at t*,</text><text x="524" y="484" fill="#5a5a5a">streams chat to the server</text></g><g><rect x="40" y="596" width="208" height="88" rx="8" fill="none" stroke="#8a8a8a" stroke-width="1.25"></rect><text x="52" y="620" font-size="13" font-weight="600" fill="#1a1a1a">process_agentic_result</text><text x="52" y="636" fill="#5a5a5a">infx/results/agentic</text><text x="52" y="652" fill="#5a5a5a">→ RESULT_FILENAME.json</text><text x="52" y="668" fill="#5a5a5a">tput/GPU, interactivity</text></g><g><rect x="276" y="596" width="208" height="88" rx="8" fill="none" stroke="#8a8a8a" stroke-width="1.25"></rect><text x="288" y="620" font-size="13" font-weight="600" fill="#1a1a1a">validate_agentic_result</text><text x="288" y="636" fill="#5a5a5a">fails the point when the</text><text x="288" y="652" fill="#5a5a5a">error rate is above 10 %</text><text x="288" y="668" fill="#5a5a5a">(runtime_settings.sh)</text></g><g><rect x="512" y="596" width="208" height="88" rx="8" fill="none" stroke="#8a8a8a" stroke-width="1.25"></rect><text x="524" y="620" font-size="13" font-weight="600" fill="#1a1a1a">Upload → dashboard</text><text x="524" y="636" fill="#5a5a5a">Actions artifacts;</text><text x="524" y="652" fill="#5a5a5a">InferenceX-app ingests</text><text x="524" y="668" fill="#5a5a5a">them (separate repo)</text></g></svg>
