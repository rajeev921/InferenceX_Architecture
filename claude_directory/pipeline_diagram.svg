<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 540' width='760' height='540' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>
<rect width='760' height='540' fill='#ffffff'/>
<defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#8a8f98'/></marker></defs>
<text x='24' y='30' font-size='15' font-weight='600' fill='#1f2328'>A changelog line becomes a dashboard point in nine steps</text>
<rect x='24' y='52' width='696' height='136' rx='8' fill='#f3f4f6'/>
<text x='40' y='72' font-size='11.5' font-weight='600' fill='#57606a'>GitHub Actions, ubuntu-latest: control plane</text>
<rect x='24' y='216' width='696' height='136' rx='8' fill='#f3f4f6'/>
<text x='40' y='236' font-size='11.5' font-weight='600' fill='#57606a'>GPU fleet: self-hosted runner on a Slurm login node</text>
<rect x='24' y='380' width='696' height='136' rx='8' fill='#f3f4f6'/>
<text x='704' y='400' font-size='11.5' font-weight='600' text-anchor='end' fill='#57606a'>Results: GitHub artifacts, then InferenceX-app</text>
<g fill='none' stroke='#8a8f98' stroke-width='1.25'><path d='M240 128H272' marker-end='url(#a)'/><path d='M472 128H504' marker-end='url(#a)'/><path d='M604 172V248' marker-end='url(#a)'/><path d='M504 292H472' marker-end='url(#a)'/><path d='M272 292H240' marker-end='url(#a)'/><path d='M140 336V412' marker-end='url(#a)'/><path d='M240 456H272' marker-end='url(#a)'/><path d='M472 456H504' marker-end='url(#a)'/></g>
<rect x='40' y='84' width='200' height='88' rx='8' fill='#ffffff' stroke='#8a8f98' stroke-width='1.25'/><text x='52' y='108' font-size='13' font-weight='600' fill='#1f2328'>1 · Declare</text><text x='52' y='128' font-size='11.5' fill='#57606a'>configs/*-master.yaml</text><text x='52' y='144' font-size='11.5' fill='#57606a'>runners.yaml labels</text><text x='52' y='160' font-size='11.5' fill='#57606a'>PR appends changelog entry</text>
<rect x='272' y='84' width='200' height='88' rx='8' fill='#ffffff' stroke='#8a8f98' stroke-width='1.25'/><text x='284' y='108' font-size='13' font-weight='600' fill='#1f2328'>2 · Plan</text><text x='284' y='128' font-size='11.5' fill='#57606a'>infx.matrix.plan + generate</text><text x='284' y='144' font-size='11.5' fill='#57606a'>strict Pydantic validation</text><text x='284' y='160' font-size='11.5' fill='#57606a'>JSON matrix in buckets</text>
<rect x='504' y='84' width='200' height='88' rx='8' fill='#ffffff' stroke='#8a8f98' stroke-width='1.25'/><text x='516' y='108' font-size='13' font-weight='600' fill='#1f2328'>3 · Fan out</text><text x='516' y='128' font-size='11.5' fill='#57606a'>run-sweep.yml</text><text x='516' y='144' font-size='11.5' fill='#57606a'>schema check, priority</text><text x='516' y='160' font-size='11.5' fill='#57606a'>one job per matrix row</text>
<rect x='504' y='248' width='200' height='88' rx='8' fill='#ffffff' stroke='#8a8f98' stroke-width='1.25'/><text x='516' y='272' font-size='13' font-weight='600' fill='#1f2328'>4 · Launch</text><text x='516' y='292' font-size='11.5' fill='#57606a'>benchmark-tmpl.yml</text><text x='516' y='308' font-size='11.5' fill='#57606a'>row JSON to env vars</text><text x='516' y='324' font-size='11.5' fill='#57606a'>launch_fleet.sh by name</text>
<rect x='272' y='248' width='200' height='88' rx='8' fill='#ffffff' stroke='#8a8f98' stroke-width='1.25'/><text x='284' y='272' font-size='13' font-weight='600' fill='#1f2328'>5 · Allocate</text><text x='284' y='292' font-size='11.5' fill='#57606a'>srtctl apply recipe</text><text x='284' y='308' font-size='11.5' fill='#57606a'>Slurm job, pyxis/enroot</text><text x='284' y='324' font-size='11.5' fill='#57606a'>squashfs image cache</text>
<rect x='40' y='248' width='200' height='88' rx='8' fill='#2f6fde' fill-opacity='0.12' stroke='#2f6fde' stroke-width='2'/><text x='52' y='272' font-size='13' font-weight='600' fill='#1f2328'>6 · Serve and measure</text><text x='52' y='292' font-size='11.5' fill='#1f2328'>vLLM · SGLang · TRT-LLM</text><text x='52' y='308' font-size='11.5' fill='#1f2328'>bench_serving / aiperf load</text><text x='52' y='324' font-size='11.5' fill='#1f2328'>evals + GPU power CSV</text>
<rect x='40' y='412' width='200' height='88' rx='8' fill='#ffffff' stroke='#8a8f98' stroke-width='1.25'/><text x='52' y='436' font-size='13' font-weight='600' fill='#1f2328'>7 · Aggregate</text><text x='52' y='456' font-size='11.5' fill='#57606a'>infx.results build_result</text><text x='52' y='472' font-size='11.5' fill='#57606a'>tput/GPU, intvty, J/token</text><text x='52' y='488' font-size='11.5' fill='#57606a'>upload bmk_*, eval_*</text>
<rect x='272' y='412' width='200' height='88' rx='8' fill='#ffffff' stroke='#8a8f98' stroke-width='1.25'/><text x='284' y='436' font-size='13' font-weight='600' fill='#1f2328'>8 · Collect</text><text x='284' y='456' font-size='11.5' fill='#57606a'>collect-results.yml</text><text x='284' y='472' font-size='11.5' fill='#57606a'>results_bmk artifact</text><text x='284' y='488' font-size='11.5' fill='#57606a'>eval_results_all artifact</text>
<rect x='504' y='412' width='200' height='88' rx='8' fill='#ffffff' stroke='#8a8f98' stroke-width='1.25'/><text x='516' y='436' font-size='13' font-weight='600' fill='#1f2328'>9 · Ingest</text><text x='516' y='456' font-size='11.5' fill='#57606a'>repository_dispatch</text><text x='516' y='472' font-size='11.5' fill='#57606a'>InferenceX-app to Postgres</text><text x='516' y='488' font-size='11.5' fill='#57606a'>dashboard + public API</text>
</svg>
