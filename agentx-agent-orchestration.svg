<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="955" viewBox="0 0 1160 955" role="img" aria-labelledby="title desc"><title id="title">Agent orchestration and request traffic</title><desc id="desc">The replay controller schedules logical conversations through credits, worker sessions and an existing model endpoint. The illustrative timeline shows one tree producing three simultaneous requests and retaining its slot after the parent completes.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#55707a"/></marker></defs><rect width="1160" height="955" fill="#f5f8f5"/><text x="28" y="34" font-family="Arial,sans-serif" font-size="14" fill="#086d69" font-weight="700" text-anchor="start">VERIFIED CONTROL AND EXECUTION PATH</text><rect x="28" y="62" width="260" height="125" rx="5" fill="white" stroke="#c5d5d5"/><text x="42" y="89" font-family="Arial,sans-serif" font-size="16" fill="#086d69" font-weight="700" text-anchor="start">Templates → session instances</text><text x="42" y="113" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">ConversationSource / UUID</text><text x="42" y="134" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">Root + parent + branch identity</text><text x="42" y="155" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">Recorded turns and dependencies</text><text x="42" y="176" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">No per-agent model/container</text><rect x="339" y="62" width="365" height="125" rx="5" fill="white" stroke="#c5d5d5"/><text x="353" y="89" font-family="Arial,sans-serif" font-size="16" fill="#086d69" font-weight="700" text-anchor="start">Replay controller</text><text x="353" y="113" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">Timers + BranchOrchestrator joins</text><text x="353" y="134" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">ReplayBarrierCoordinator predecessors</text><text x="353" y="155" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">CreditIssuer + client concurrency</text><text x="353" y="176" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">SessionTreeRegistry owns slot release</text><rect x="757" y="62" width="375" height="125" rx="5" fill="white" stroke="#c5d5d5"/><text x="771" y="89" font-family="Arial,sans-serif" font-size="16" fill="#086d69" font-weight="700" text-anchor="start">Sticky router → worker</text><text x="771" y="113" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">One credit per request; async execution</text><text x="771" y="134" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">UserSession holds client history</text><text x="771" y="155" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">Endpoint adapter → HTTP model server</text><text x="771" y="176" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">Worker is not the logical agent</text><path d="M293 121L333 121" stroke="#55707a" fill="none" stroke-width="1.6" marker-end="url(#arr)"/><path d="M709 121L751 121" stroke="#55707a" fill="none" stroke-width="1.6" marker-end="url(#arr)"/><path d="M940 192V225H521V193" stroke="#55707a" fill="none" stroke-width="1.6" marker-end="url(#arr)"/><text x="728" y="249" font-family="Arial,sans-serif" font-size="14" fill="#55707a" font-weight="400" text-anchor="middle">CreditReturn → gates / continuation / drain</text><text x="28" y="307" font-family="Arial,sans-serif" font-size="14" fill="#956119" font-weight="700" text-anchor="start">ILLUSTRATIVE TRAFFIC / one tree lane; authored branch example, not measured Weka traffic</text><path d="M185 345V684" stroke="#c5d5d5" stroke-dasharray="3 5"/><text x="185" y="333" font-family="Arial,sans-serif" font-size="12" fill="#55707a" font-weight="400" text-anchor="middle">0s</text><path d="M273 345V684" stroke="#c5d5d5" stroke-dasharray="3 5"/><text x="273" y="333" font-family="Arial,sans-serif" font-size="12" fill="#55707a" font-weight="400" text-anchor="middle">2s</text><path d="M405 345V684" stroke="#c5d5d5" stroke-dasharray="3 5"/><text x="405" y="333" font-family="Arial,sans-serif" font-size="12" fill="#55707a" font-weight="400" text-anchor="middle">5s</text><path d="M493 345V684" stroke="#c5d5d5" stroke-dasharray="3 5"/><text x="493" y="333" font-family="Arial,sans-serif" font-size="12" fill="#55707a" font-weight="400" text-anchor="middle">7s</text><path d="M581 345V684" stroke="#c5d5d5" stroke-dasharray="3 5"/><text x="581" y="333" font-family="Arial,sans-serif" font-size="12" fill="#55707a" font-weight="400" text-anchor="middle">9s</text><path d="M669 345V684" stroke="#c5d5d5" stroke-dasharray="3 5"/><text x="669" y="333" font-family="Arial,sans-serif" font-size="12" fill="#55707a" font-weight="400" text-anchor="middle">11s</text><path d="M757 345V684" stroke="#c5d5d5" stroke-dasharray="3 5"/><text x="757" y="333" font-family="Arial,sans-serif" font-size="12" fill="#55707a" font-weight="400" text-anchor="middle">13s</text><path d="M845 345V684" stroke="#c5d5d5" stroke-dasharray="3 5"/><text x="845" y="333" font-family="Arial,sans-serif" font-size="12" fill="#55707a" font-weight="400" text-anchor="middle">15s</text><path d="M1065 345V684" stroke="#c5d5d5" stroke-dasharray="3 5"/><text x="1065" y="333" font-family="Arial,sans-serif" font-size="12" fill="#55707a" font-weight="400" text-anchor="middle">20s</text><text x="28" y="396" font-family="Arial,sans-serif" font-size="16" fill="#086d69" font-weight="700" text-anchor="start">Parent</text><rect x="185" y="373" width="88" height="38" rx="4" fill="#086d69"/><text x="229.0" y="397" font-family="Arial,sans-serif" font-size="14" fill="white" font-weight="700" text-anchor="middle">P0</text><rect x="493" y="373" width="88" height="38" rx="4" fill="#086d69"/><text x="537.0" y="397" font-family="Arial,sans-serif" font-size="14" fill="white" font-weight="700" text-anchor="middle">P1</text><rect x="669" y="373" width="88" height="38" rx="4" fill="#086d69"/><text x="713.0" y="397" font-family="Arial,sans-serif" font-size="14" fill="white" font-weight="700" text-anchor="middle">P2</text><text x="28" y="476" font-family="Arial,sans-serif" font-size="16" fill="#448581" font-weight="700" text-anchor="start">Child A</text><rect x="273" y="453" width="132" height="38" rx="4" fill="#448581"/><text x="339.0" y="477" font-family="Arial,sans-serif" font-size="14" fill="white" font-weight="700" text-anchor="middle">A0</text><text x="28" y="556" font-family="Arial,sans-serif" font-size="16" fill="#448581" font-weight="700" text-anchor="start">Child B</text><rect x="317" y="533" width="176" height="38" rx="4" fill="#448581"/><text x="405.0" y="557" font-family="Arial,sans-serif" font-size="14" fill="white" font-weight="700" text-anchor="middle">B0</text><rect x="537" y="533" width="132" height="38" rx="4" fill="#448581"/><text x="603.0" y="557" font-family="Arial,sans-serif" font-size="14" fill="white" font-weight="700" text-anchor="middle">B1</text><text x="28" y="636" font-family="Arial,sans-serif" font-size="16" fill="#956119" font-weight="700" text-anchor="start">Background C</text><rect x="273" y="613" width="792" height="38" rx="4" fill="#956119"/><text x="669.0" y="637" font-family="Arial,sans-serif" font-size="14" fill="white" font-weight="700" text-anchor="middle">C0</text><text x="493" y="433" font-family="Arial,sans-serif" font-size="12" fill="#55707a" font-weight="400" text-anchor="start">P1 waits for delay AND A</text><text x="669" y="497" font-family="Arial,sans-serif" font-size="12" fill="#55707a" font-weight="400" text-anchor="start">P2 waits for B</text><text x="757" y="687" font-family="Arial,sans-serif" font-size="12" fill="#55707a" font-weight="400" text-anchor="middle">Parent ends at 13</text><text x="1065" y="710" font-family="Arial,sans-serif" font-size="12" fill="#956119" font-weight="700" text-anchor="end">Tree drains at 20</text><rect x="28" y="754" width="342" height="104" rx="5" fill="white" stroke="#c5d5d5"/><text x="42" y="781" font-family="Arial,sans-serif" font-size="16" fill="#086d69" font-weight="700" text-anchor="start">Tree concurrency = 1</text><text x="42" y="805" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">Slot remains held for background C</text><text x="42" y="826" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">Replacement root starts only after drain</text><rect x="409" y="754" width="342" height="104" rx="5" fill="white" stroke="#c5d5d5"/><text x="423" y="781" font-family="Arial,sans-serif" font-size="16" fill="#086d69" font-weight="700" text-anchor="start">Peak HTTP in flight = 3</text><text x="423" y="805" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">34 request-seconds / 20 seconds</text><text x="423" y="826" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">Average HTTP concurrency = 1.7</text><rect x="790" y="754" width="342" height="104" rx="5" fill="white" stroke="#c5d5d5"/><text x="804" y="781" font-family="Arial,sans-serif" font-size="16" fill="#086d69" font-weight="700" text-anchor="start">Throughput has a unit</text><text x="804" y="805" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">7 requests / 20s = 0.35 requests/s</text><text x="804" y="826" font-family="Arial,sans-serif" font-size="13" fill="#55707a" font-weight="400" text-anchor="start">1 tree / 20s = 0.05 trees/s</text><text x="28" y="901" font-family="Arial,sans-serif" font-size="16" fill="#17303b" font-weight="700" text-anchor="start">A terminal child satisfies scheduler bookkeeping; it does not establish task correctness.</text><text x="28" y="929" font-family="Arial,sans-serif" font-size="14" fill="#55707a" font-weight="400" text-anchor="start">Live VLM agents additionally interpret actual outputs, execute tools, change observations, and score task state.</text></svg>