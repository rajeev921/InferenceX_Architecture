<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="710" viewBox="0 0 1100 710" role="img" aria-labelledby="title desc"><title id="title">InferenceX: execution, publication, and browsing</title><desc id="desc">Three connected paths. Configurations start GitHub GPU jobs. Artifacts are ingested into PostgreSQL. Browser chart controls read existing data through APIs.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#57707a"/></marker></defs><rect width="1100" height="710" rx="12" fill="#f7f9f7"/><text x="28" y="34" font-family="Arial, sans-serif" font-size="14" fill="#57707a" font-weight="700" text-anchor="start">PUBLIC-CODE ARCHITECTURE</text><text x="1072" y="34" font-family="Arial, sans-serif" font-size="13" fill="#57707a" font-weight="400" text-anchor="end">Source revision: 24 Sep 2026</text><text x="28" y="75" font-family="Arial, sans-serif" font-size="15" fill="#a86717" font-weight="700" text-anchor="start">A / EXECUTE — InferenceX repository and accelerator fleet</text><a href="https://github.com/SemiAnalysisAI/InferenceX/blob/5abd17e2ef546bd557608b370a8ff6123a170cbf/configs/CONFIGS.md" target="_blank"><rect x="28" y="92" width="228" height="120" rx="7" fill="white" stroke="#c4d2d5"/><rect x="28" y="104" width="3" height="96" fill="#a86717"/><text x="43" y="120" font-family="Arial, sans-serif" font-size="16" fill="#a86717" font-weight="700" text-anchor="start">01  Experiment catalog</text><text x="43" y="146" font-family="Arial, sans-serif" font-size="13" fill="#57707a" font-weight="400" text-anchor="start">Master YAML + runners.yaml</text><text x="43" y="167" font-family="Arial, sans-serif" font-size="13" fill="#57707a" font-weight="400" text-anchor="start">perf-changelog selects work</text><text x="43" y="188" font-family="Arial, sans-serif" font-size="13" fill="#57707a" font-weight="400" text-anchor="start">Model · image · load · topology<