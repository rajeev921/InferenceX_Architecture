 · mounts · allocation</text></a><path d="M804 152L839 152" fill="none" stroke="#57707a" stroke-width="1.5" marker-end="url(#arrow)"/><a href="https://github.com/SemiAnalysisAI/InferenceX/blob/5abd17e2ef546bd557608b370a8ff6123a170cbf/benchmarks/benchmark_lib.sh" target="_blank"><rect x="844" y="92" width="228" height="120" rx="7" fill="white" stroke="#c4d2d5"/><rect x="844" y="104" width="3" height="96" fill="#a86717"/><text x="859" y="120" font-family="Arial, sans-serif" font-size="16" fill="#a86717" font-weight="700" text-anchor="start">04  Benchmark runtime</text><text x="859" y="146" font-family="Arial, sans-serif" font-size="13" fill="#57707a" font-weight="400" text-anchor="start">Serving engine + load client</text><text x="859" y="167" font-family="Arial, sans-serif" font-size="13" fill="#57707a" font-weight="400" text-anchor="start">Fixed sequence OR AgentX</text><text x="859" y="188" font-family="Arial, sans-serif" font-size="13" fill="#57707a" font-weight="400" text-anchor="start">Metrics · evaluation · logs</text></a><path d="M958 214L958 288" fill="none" stroke="#57707a" stroke-width="1.5" marker-end="url(#arrow)"/><text x="28" y="275" font-family="Arial, sans-serif" font-size="15" fill="#a86717" font-weight="700" text-anchor="start">B / PUBLISH — artifact handoff into InferenceX-app</text><a href="https://github.com/SemiAnalysisAI/InferenceX-app/blob/b710865c22e631d1cf0420f029afbd950ee73bb8/packages/db/migrations/001_initial_schema.sql" target="_blank"><rect x="28" y="292" width="228" height="120" rx="7" fill="white" stroke="#c4d2d5"/><rect x="28" y="304" width="3" height="96" fill="#a86717"/><text x="43" y="320" font-family="Arial, sans-serif" font-size="16" fill="#a86717" font-weight="700" text-anchor="start">08  PostgreSQL</text><text x="43" y="346" font-family="Arial, sans-serif" font-size="13" fill="#57707a" font-weight="400" text-anchor="start">Configs + workflow provenance</text><text x="43" y="367" font-family="Arial, sans-serif" font-size="13" fill="#57707a" font-weight="400" text-anchor="start">Metrics JSONB + history</text><text x="43" y="388" font-family="Arial, sans-serif" font-size="13" fill="#57707a" font-weight="400" text-anchor="start">Latest view + trace sidecars</text></a><path d="M296 352L261 352" fill="none" stroke="#57707a" stroke-width="1.5" marker-end="url(#arrow)"/><a href="https://github.com/SemiAnalysisAI/InferenceX-app/blob/b710865c22e631d1cf0420f029afbd950ee73bb8/.github/workflows/ingest-results.yml" target="_blank"><rect x="300" y="292" width="228" height="120" rx="7" fill="white" stroke="#c4d2d5"/><rect x="300" y="304" width="3" height="96" fill="#a86717"/><text x="315" y="320" font-family="Arial, sans-serif" font-size="16" fill="#a86717" font-weight="700" text-anchor="start">07  Ingest + verify</text><text x="315" y="346" font-family="Arial, sans-serif" font-size="13" fill="#57707a" font-weight="400" text-anchor="start">Normalize + idempotent upsert</text><text x="315" y="367" font-family="Arial, sans-serif" font-size="13" fill="#57707a" font-weight="400" text-anchor="start">Refresh latest · apply overrides</text><text x="315" y="388" font-family="Arial, sans-serif" font-size="13" fill="#57707a" font-weight="400" text-anchor="start">Verify → invalidate caches</text></a><path d="M568 352L533 352" fill="none" stroke="#57707a" stroke-width="1.5" marker-end="url(#arrow)"/><a href="https://github.com/SemiAnalysisAI/InferenceX/blob/5abd17e2ef546bd557608b370a8ff6123a170cbf/.github/workflows/run-sweep.yml" target="_blank"><rect x="572" y="292" width="228" height="120" rx="7" fill="white" stroke="#c4d2d5"/><rect x="572" y="304" width="3" height="96" fill="#a86717"/><text x="587" y="320" font-family="Arial, sans-serif" font-size="16" fill="#a86717" font-weight="700" text-anchor="start">06  Repository dispatch</text><text x="587" y="346" font-family="Arial, sans-serif" font-size="13" fill="#57707a" font-weight="400" text-anchor="start">ingest-results OR</text><text x="587" y="367" font-family="Arial, sans-serif" font-size="13" fill="#57707a" font-weight="400" text-anchor="start">ingest-agentic-results</text><text x="587" y="388" font-family="Arial, sans-serif" font-size="13" fill="#57707a" font-weight="400" text-anchor="start">Source run + merge run IDs</text></a><path d="M840 352L805 352" fill="none" stroke="#57707a" stroke-width="1.5" marker-end="url(#arrow)"/><a href="https://github.com/SemiAnalysisAI/InferenceX/blob/5abd17e2ef546bd557608b370a8ff6123a170cbf/.github/workflows/collect-results.yml" target="_blank"><rect x="844" y="292" width="228" height="120" rx="7" fill="white" stroke="#c4d2d5"/><rect x="844" y="304" width="3" height="96" fill="#a86717"/><text x="859" y="320" font-family="Arial, sans-serif" font-size="16" fill="#a86717" font-weight="700" text-anchor="start">05  Actions artifacts</text><text x="859" y="346" font-family="Arial, sans-serif" font-size="13" fill="#57707a" font-weight="400" text-anchor="start">bmk_* and results_bmk</text><text x="859" y="367" font-family="Arial, sans-serif" font-size="13" fill="#57707a" font-weight="400" text-anchor="start">AgentX summary + raw traces</text><text x="859" y="388" font-family="Arial, sans-serif" font-size="13" fill="#57707a" font-weight="400" text-anchor="start">Eval artifacts + changelog</text></a><path d="M142 414V438H16V550H24" fill="none" stroke="#57707a" stroke-width="1.5" marker-end="url(#arrow)"/><text x="28" y="475" font-family="Arial, sans-serif" font-size="15" fill="#096d69" font-weight="700" text-anchor="start">C / BROWSE — a separate read path; chart selections enter here</text><a href="https://github.com/SemiAnalysisAI/InferenceX-app/blob/b710865c22e631d1cf0420f029afbd950ee73bb8/packages/app/src/lib/api-cache.ts" target="_blank"><rect x="28" y="492" width="228" height="120" rx="7" fill="white" stroke="#c4d2d5"/><rect x="28" y="504" width="3" height="96" fill="#096d69"/><text x="43" y="520" font-family="Arial, sans-serif" font-size="16" fill="#096d69" font-weight="700" text-anchor="