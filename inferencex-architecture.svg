t-size="16" fill="#096d69" font-weight="700" text-anchor="start">11  React browser state</text><text x="587" y="546" font-family="Arial, sans-serif" font-size="13" fill="#57707a" font-weight="400" text-anchor="start">React Query + filter providers</text><text x="587" y="567" font-family="Arial, sans-serif" font-size="13" fill="#57707a" font-weight="400" text-anchor="start">Select · transform · calculate</text><text x="587" y="588" font-family="Arial, sans-serif" font-size="13" fill="#57707a" font-weight="400" text-anchor="start">History / precision / axes</text></a><path d="M804 552L839 552" fill="none" stroke="#57707a" stroke-width="1.5" marker-end="url(#arrow)"/><a href="https://github.com/SemiAnalysisAI/InferenceX-app/blob/b710865c22e631d1cf0420f029afbd950ee73bb8/packages/app/src/lib/benchmark-transform.ts" target="_blank"><rect x="844" y="492" width="228" height="120" rx="7" fill="white" stroke="#c4d2d5"/><rect x="844" y="504" width="3" height="96" fill="#096d69"/><text x="859" y="520" font-family="Arial, sans-serif" font-size="16" fill="#096d69" font-weight="700" text-anchor="start">12  D3 charts + tables</text><text x="859" y="546" font-family="Arial, sans-serif" font-size="13" fill="#57707a" font-weight="400" text-anchor="start">Measured data + derived views</text><text x="859" y="567" font-family="Arial, sans-serif" font-size="13" fill="#57707a" font-weight="400" text-anchor="start">Point details + source links</text><text x="859" y="588" font-family="Arial, sans-serif" font-size="13" fill="#57707a" font-weight="400" text-anchor="start">Share · export · compare</text></a><text x="28" y="652" font-family="Arial, sans-serif" font-size="16" fill="#096d69" font-weight="700" text-anchor="start">A UI selection changes a query or a chart. It does not connect back to the GPU job trigger.</text><text x="28" y="678" font-family="Arial, sans-serif" font-size="13" fill="#57707a" font-weight="400" text-anchor="start">Exceptions: unofficial artifact overlays, supplemental